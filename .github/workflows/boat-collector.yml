name: BOAT EDGE automatic collector

on:
  schedule:
    - cron: '2-57/5 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/boat-collector.yml']
  workflow_dispatch:

permissions: {}

concurrency:
  group: boat-edge-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
    steps:
      - name: Refresh race data and reconcile results
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$COLLECTOR_TOKEN" ]; then
            echo 'COLLECTOR_TOKEN repository secret is missing.' >&2
            exit 1
          fi
          echo "Collector started at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl --fail-with-body --silent --show-error --retry-all-errors --retry 2 --retry-delay 3 --max-time 180 \
            --header "x-collector-token: $COLLECTOR_TOKEN" \
            'https://boatrace-ai-forecast.yoshinaga5454.chatgpt.site/api/collector' \
            --output collector-response.json
          python3 -c 'import json; r=json.load(open("collector-response.json")); print("date={date} targets={targets} completed={completed} recorded={recorded} failed={failed} updatedAt={updatedAt}".format(**r)); assert r.get("ok") is True; assert r["completed"] == r["targets"]'
